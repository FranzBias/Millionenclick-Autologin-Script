# Why: this is a userscript, so the useful facts are the browser and the
# userscript manager, not the Linux desktop. This form collects them up front.
name: Bug report
description: The script does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! You can write in English, Italian or German.
        Please never paste your password or personal data here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the page ...
        2. Wait for ...
        3. See error
    validations:
      required: true
  - type: input
    id: script-version
    attributes:
      label: Script version
      description: Shown in your userscript manager's dashboard.
      placeholder: e.g. 1.4
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome / Chromium
        - Brave
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. Firefox 145
  - type: dropdown
    id: manager
    attributes:
      label: Userscript manager
      options:
        - Tampermonkey
        - Violentmonkey
        - Greasemonkey
        - Other
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Press F12, open the Console tab, reload the page and paste any red error message here.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (without personal data), workarounds, ideas for a fix.
